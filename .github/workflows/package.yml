name: Native desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['m6-*', 'desktop-*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux}
          - {os: windows-2022, target: windows}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64 patchelf
      - run: uv sync --locked --python 3.12 --group build
      - run: uv run --no-sync python scripts/build_desktop.py --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: NovelTTSReader-${{ matrix.target }}-x86_64
          path: |
            dist/NovelTTSReader-*.zip*
            dist/NovelTTSReader-*.tar.gz*
          if-no-files-found: error
