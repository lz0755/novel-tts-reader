name: Native desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['m6-*', 'desktop-*']
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux}
          - {os: windows-2022, target: windows}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64 libgssapi-krb5-2 libatomic1 libcups2t64 libgtk-3-0t64 libwayland-cursor0 libwayland-egl1 patchelf
      - run: uv sync --locked --python 3.12 --group build
      - run: uv run --no-sync python scripts/build_desktop.py --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: NovelTTSReader-${{ matrix.target }}-x86_64
          path: |
            dist/NovelTTSReader-*.zip*
            dist/NovelTTSReader-*.tar.gz*
          if-no-files-found: error
      - name: Make room for the CUDA runtime on the hosted Linux image
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]] && (( $(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9') < 28 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h "$RUNNER_TEMP"
      - name: Build and test the offline Qwen desktop from the same native directory
        if: startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')
        run: uv run --no-sync python scripts/package_qwen.py --desktop dist/launcher.dist --output dist/qwen
        env:
          UV_HTTP_TIMEOUT: "300"
          UV_HTTP_RETRIES: "5"
          UV_CONCURRENT_DOWNLOADS: "4"
      - name: Attach checked Qwen volumes, speech sample and verification report to the draft
        if: startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          cd dist/qwen
          sha256sum -c *.sha256
          for asset in *; do
            for attempt in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$asset" --clobber; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              sleep 10
            done
          done
