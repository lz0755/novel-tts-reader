name: Native desktop packages
on:
  workflow_dispatch:
    inputs:
      include_qwen:
        description: "Also assemble Qwen 0.6B full bundle via scripts/package_qwen.py"
        type: boolean
        default: false
  push:
    tags: ['m6-*', 'desktop-*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux}
          - {os: windows-2022, target: windows}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libasound2t64 libgssapi-krb5-2 libatomic1 libcups2t64 libgtk-3-0t64 libwayland-cursor0 libwayland-egl1 patchelf
      - run: uv sync --locked --python 3.12 --python-preference only-managed --group build
      - run: uv run --no-sync python scripts/build_desktop.py --platform ${{ matrix.target }}
      - name: Make room for the CUDA runtime on the hosted Linux image
        if: runner.os == 'Linux' && (inputs.include_qwen == true || (startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')))
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]] && (( $(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9') < 28 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h "$RUNNER_TEMP"
      - if: ${{ inputs.include_qwen == true }}
        run: |
          uv sync --locked --project sidecar --extra qwen --python 3.12 --python-preference only-managed
          uv run --no-sync --project sidecar python -m novel_tts_sidecar.prepare --model 0.6B --root build/qwen-models
          uv run --no-sync python scripts/package_qwen.py --platform ${{ matrix.target }} --core-dir dist/launcher.dist --models-root build/qwen-models --models 0.6B --output dist
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: NovelTTSReader-${{ matrix.target }}-x86_64
          path: |
            dist/NovelTTSReader-*.zip*
            dist/NovelTTSReader-*.tar.gz*
          if-no-files-found: error
      - name: Build and test the offline Qwen desktop from the same native directory
        if: startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')
        run: uv run --no-sync python scripts/package_qwen.py --desktop dist/launcher.dist --output dist/qwen
        env:
          UV_HTTP_TIMEOUT: "300"
          UV_HTTP_RETRIES: "5"
          UV_CONCURRENT_DOWNLOADS: "4"
      - name: Preserve checked Qwen volumes and speech evidence
        if: startsWith(github.ref, 'refs/tags/desktop-') && !contains(github.ref_name, 'preview')
        uses: actions/upload-artifact@v4
        with:
          name: OfflineQwen-${{ matrix.target }}-x86_64
          path: dist/qwen/*
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error
