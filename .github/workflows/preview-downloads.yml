name: Attach native release downloads

on:
  workflow_run:
    workflows: [Native desktop packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful desktop tag build run ID
        required: true
        type: string

jobs:
  attach:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'desktop-'))
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: ${{ inputs.build_run || github.event.workflow_run.id }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Identify the trusted build and release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .event == "push" and
            .head_repository.full_name == $repo and .path == ".github/workflows/package.yml"
          ' <<< "$run" > /dev/null
          tag=$(jq -r .head_branch <<< "$run")
          sha=$(jq -r .head_sha <<< "$run")
          [[ "$tag" =~ ^desktop-[a-zA-Z0-9._-]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$sha"
          release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft,isPrerelease)
          jq -e '.isDraft or .isPrerelease' <<< "$release" > /dev/null
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_API=$(jq -r .apiUrl <<< "$release")" >> "$GITHUB_ENV"
          echo "RELEASE_DRAFT=$(jq -r .isDraft <<< "$release")" >> "$GITHUB_ENV"
          if [[ "$tag" != *preview* ]]; then echo "qwen=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_ID }}
          name: NovelTTSReader-${{ matrix.target }}-x86_64
          path: core
      - if: steps.release.outputs.qwen == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_ID }}
          name: OfflineQwen-${{ matrix.target }}-x86_64
          path: full
      - name: Verify checksums and attach release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ext=tar.gz
          if [[ "$TARGET" == windows ]]; then ext=zip; fi
          core="NovelTTSReader-$TARGET-x86_64.$ext"
          (cd core && sha256sum -c "$core.sha256")
          files=("core/$core" "core/$core.sha256")
          if [[ -d full ]]; then
            prefix="NovelTTSReader-Qwen-0.6B-$TARGET-x86_64"
            volumes=(full/"$prefix".7z.[0-9][0-9][0-9])
            (( ${#volumes[@]} > 0 ))
            (cd full && sha256sum -c "$prefix.sha256")
            jq -e --arg sha "$BUILD_SHA" '
              .commit == $sha and .verified_model_files == 13 and .sample_rate == 24000 and
              .desktop_self_test == "passed" and .bundled_sidecar_handshake == "passed"
            ' "full/$prefix.check.json" > /dev/null
            test "$(sha256sum "full/$prefix.sample.wav" | cut -d' ' -f1)" = "$(jq -r .sample_sha256 "full/$prefix.check.json")"
            files+=("${volumes[@]}" "full/$prefix.sha256" "full/$prefix.check.json" "full/$prefix.sample.wav")
          fi
          existing=$(gh api "$RELEASE_API" --jq .assets)
          for file in "${files[@]}"; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            previous=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .digest // "pending"' <<< "$existing")
            if [[ "$previous" == "$digest" ]]; then continue; fi
            options=()
            if [[ "$RELEASE_DRAFT" == true ]]; then options+=(--clobber); else test -z "$previous"; fi
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" "${options[@]}"; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              sleep 10
            done
          done
