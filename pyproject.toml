[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "novel-tts-reader"
version = "0.1.0"
description = "中文小说多角色朗读桌面工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.9.3", "regex==2025.11.3", "jsonschema==4.25.1",
  "httpx==0.28.1", "keyring==25.6.0", "platformdirs==4.5.0",
]

[project.scripts]
novel-tts = "novel_tts.__main__:main"

[dependency-groups]
dev = ["pytest==8.4.2"]
build = ["Nuitka==4.3.5", "ordered-set==4.1.0", "zstandard==0.25.0", "patchelf==0.17.2.4; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src","sidecar"]
